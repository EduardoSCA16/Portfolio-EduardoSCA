name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Configurar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar a versão de produção
        run: pnpm run build

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar os arquivos para publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
